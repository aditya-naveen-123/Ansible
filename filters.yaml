- name: filters in ansible
  hosts: local
  connection: local
  vars:
    topics: "Linux,Ansinble,Docker,Terraform"
    tagmap:
      name: ansible
      project: roboshop
      environment: dev
    taglist:
      [
        {
            "key": "name",
            "value": "ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "environment",
            "value": "dev"
        }
    ]
    full_name: aditya naveen muddana
    ip_address: 54.174.47.23

  tasks:
  - name: Convert string to list
    debug:
      msg: "Topics are: {{topics | split(',')}}"

  - name: Default variable value
    debug:
      msg : "Hi {{Greeting | default('Hello')}}"

  - name: convert map to list
    debug:
      msg: "{{tagmap | dict2items}}"

  - name: convert list to dict2items
    debug:
      msg: "{{taglist | items2dict}}"

  - name: converting full name to upper case
    debug:
      msg: "{{full_name | upper }}"

  - name: check ipv4 is valid
    debug:
      msg: "{{ip_address | ansible.utils.ipv4}}"